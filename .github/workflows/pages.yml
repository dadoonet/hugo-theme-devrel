# Deploy exampleSite to GitHub Pages (project site).
# Target URL: https://devrel.hugo.pilato.fr/
#
# One-time setup:
# 1. DNS CNAME: devrel.hugo.pilato.fr → dadoonet.github.io
# 2. Repo Settings → Pages → Source = GitHub Actions
# 3. Repo Settings → Pages → Custom domain = devrel.hugo.pilato.fr (then Enforce HTTPS)
# Tool pins: .github/versions.env (Dependabot: Actions/npm/gomod; pins: update-tool-versions.yml)
# Pull requests: Netlify deploy preview only (netlify.toml, no --buildFuture).
# --buildFuture asserts run on PRs via test-buildfuture.yml. This workflow
# does not run on PRs.

name: Deploy exampleSite

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load tool versions
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .github/versions.env
          echo "HUGO_VERSION=$HUGO_VERSION" >> "$GITHUB_ENV"
          echo "GO_VERSION=$GO_VERSION" >> "$GITHUB_ENV"
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"

      - name: Check Netlify pins match versions.env
        run: bash .github/scripts/sync-netlify-pins.sh check

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # configure-pages can return the user-site redirect URL
      # (http://david.pilato.fr/hugo-theme-devrel/) instead of the project
      # custom domain. Always build with exampleSite/hugo.toml baseURL.
      - name: Log Pages base URL (informational)
        run: |
          echo "configure-pages base_url=${{ steps.pages.outputs.base_url }}"
          echo "Using exampleSite/hugo.toml baseURL for the Hugo build."

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: exampleSite/package-lock.json

      - name: Install Hugo (extended)
        run: |
          set -euo pipefail
          curl -sL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xzf /tmp/hugo.tar.gz
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Verify tools
        run: |
          hugo version
          go version
          node --version
          npm --version

      - name: Install npm dependencies
        working-directory: exampleSite
        run: npm ci

      - name: Build exampleSite
        working-directory: exampleSite
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo mod tidy
          # Do NOT pass --baseURL from configure-pages: with a user-site
          # custom domain (david.pilato.fr) it can emit the broken project
          # path under that host. exampleSite/hugo.toml is authoritative.
          hugo --gc --minify
          npx pagefind --site public
          bash scripts/assert-svg-utf8.sh content
          bash scripts/assert-svg-utf8.sh public
          bash scripts/assert-pagefind-skips-future.sh public
          bash scripts/assert-series.sh public
          # Preview contract: --buildFuture publishes scheduled posts
          # everywhere. Production artifact above stays without the flag.
          hugo --gc --minify --buildFuture --destination public-buildFuture
          npx pagefind --site public-buildFuture
          bash scripts/assert-svg-utf8.sh public-buildFuture
          bash scripts/assert-pagefind-skips-future.sh public-buildFuture --buildFuture
          bash scripts/assert-series.sh public-buildFuture

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: exampleSite/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
