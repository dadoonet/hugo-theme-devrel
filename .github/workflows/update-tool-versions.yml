# Bump Hugo / Go / Node pins in .github/versions.env (Dependabot cannot do this).
name: Update tool versions

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-tool-versions
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read current pins
        id: current
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .github/versions.env
          {
            echo "hugo=${HUGO_VERSION}"
            echo "go=${GO_VERSION}"
            echo "node=${NODE_VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Current Hugo=${HUGO_VERSION} Go=${GO_VERSION} Node=${NODE_VERSION}"

      - name: Resolve latest versions
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HUGO=$(gh api repos/gohugoio/hugo/releases/latest --jq '.tag_name' | sed 's/^v//')
          GO=$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -1 | sed 's/^go//')
          NODE=$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r '[.[] | select(.lts != false)][0].version' | sed 's/^v//' | cut -d. -f1)
          echo "hugo=$HUGO" >> "$GITHUB_OUTPUT"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "node=$NODE" >> "$GITHUB_OUTPUT"
          echo "Resolved Hugo=$HUGO Go=$GO Node(major)=$NODE"

      - name: Compose pull request body
        env:
          HUGO_BEFORE: ${{ steps.current.outputs.hugo }}
          GO_BEFORE: ${{ steps.current.outputs.go }}
          NODE_BEFORE: ${{ steps.current.outputs.node }}
          HUGO_AFTER: ${{ steps.latest.outputs.hugo }}
          GO_AFTER: ${{ steps.latest.outputs.go }}
          NODE_AFTER: ${{ steps.latest.outputs.node }}
          PR_BODY_PATH: ${{ runner.temp }}/pr-body.md
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          def tick(value: str) -> str:
              return f"`{value}`"

          headers = ["Tool", "Version (before)", "Version (after)"]
          rows = [
              ["Hugo (extended)", tick(os.environ["HUGO_BEFORE"]), tick(os.environ["HUGO_AFTER"])],
              ["Go", tick(os.environ["GO_BEFORE"]), tick(os.environ["GO_AFTER"])],
              ["Node (major / LTS line)", tick(os.environ["NODE_BEFORE"]), tick(os.environ["NODE_AFTER"])],
          ]
          widths = [max(len(cell) for cell in col) for col in zip(headers, *rows)]

          def fmt(cells: list[str]) -> str:
              return "| " + " | ".join(c.ljust(w) for c, w in zip(cells, widths)) + " |"

          table = "\n".join(
              [
                  fmt(headers),
                  "|" + "|".join("-" * (w + 2) for w in widths) + "|",
                  *(fmt(row) for row in rows),
              ]
          )
          body = "\n".join(
              [
                  "Automated bump of CI tool pins in `.github/versions.env` and `netlify.toml`.",
                  "",
                  table,
                  "",
                  "Dependabot still owns GitHub Actions, npm (`pagefind`), and Go modules.",
                  "",
              ]
          )
          Path(os.environ["PR_BODY_PATH"]).write_text(body)
          print(body, end="")
          PY

      - name: Update versions.env
        env:
          HUGO: ${{ steps.latest.outputs.hugo }}
          GO: ${{ steps.latest.outputs.go }}
          NODE: ${{ steps.latest.outputs.node }}
        run: |
          set -euo pipefail
          {
            echo '# Single source of truth for CI tool pins (Pages, Netlify, version-bump workflow).'
            echo '# Dependabot does not update these strings — see .github/workflows/update-tool-versions.yml'
            echo '# netlify.toml copies HUGO_VERSION / GO_VERSION / NODE_VERSION from here.'
            echo "HUGO_VERSION=${HUGO}"
            echo "GO_VERSION=${GO}"
            echo "NODE_VERSION=${NODE}"
          } > .github/versions.env
          cat .github/versions.env

      - name: Sync netlify.toml pins
        run: bash .github/scripts/sync-netlify-pins.sh write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          commit-message: "chore(ci): bump tool versions (Hugo ${{ steps.latest.outputs.hugo }}, Go ${{ steps.latest.outputs.go }}, Node ${{ steps.latest.outputs.node }})"
          title: "chore(ci): bump Hugo ${{ steps.latest.outputs.hugo }} / Go ${{ steps.latest.outputs.go }} / Node ${{ steps.latest.outputs.node }}"
          body-path: ${{ runner.temp }}/pr-body.md
          branch: chore/bump-tool-versions
          delete-branch: true
          labels: dependencies,ci
