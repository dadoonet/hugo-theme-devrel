baseURL = "https://devrel.hugo.pilato.fr/"
title = "DevRel Example"
locale = "en-us"
defaultContentLanguage = "en"

# Generate upcoming talks (and scheduled posts) so they have URLs, matching
# production sites that pass --buildFuture. Listings and Pagefind still hide
# unpublished posts; Pagefind also skips future talks until their date.
buildFuture = true

[module]
  [[module.imports]]
    path = "github.com/dadoonet/hugo-theme-devrel"
  # Reuse the last Pagefind index during `hugo server`
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "public/pagefind"
    target = "static/pagefind"
    disableWatch = true

[params]
  author = "Alex Rivera"
  description = "Developer Advocate | Speaker"
  avatar = "about/alex.svg"
  headerTitle = "Alex Rivera"
  motto = "Developer Advocate | Speaker"
  email = "alex@example.org"
  siteStartYear = 2024
  favicon = "favicon.ico"
  rss = true
  lightTheme = "emerald"
  darkTheme = "forest"
  stickyNav = true
  noDefaultSummaryCover = true
  showTableOfContents = true
  showSummaryCoverInPost = true
  reorderNavItems = ["search", "posts", "talks", "about_me"]
  collapseNavItems = ["categories", "tags", "rss"]

  [params.talks]
    pdf_base_url = ""

  [params.search]
    enabled = true
